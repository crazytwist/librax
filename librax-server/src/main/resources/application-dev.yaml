server:
  port: 48080

--- #################### 数据库相关配置 ####################

spring:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          # 连接 deploy-ubuntu.sh 创建的 mysql-local 容器（docker_default 网络）
          url: jdbc:mysql://192.168.42.228:3306/librax-sz?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: root
        slave:
          lazy: true
          url: jdbc:mysql://192.168.42.228:3306/librax-sz?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: root

  # 连接 deploy-ubuntu.sh 创建的 redis-local 容器（docker_default 网络）
  data:
    redis:
      host: 192.168.42.228
      port: 6379
      database: 0

--- #################### 定时任务相关配置 ####################

spring:
  quartz:
    auto-startup: true
    scheduler-name: schedulerName
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true
            clusterCheckinInterval: 15000
            misfireThreshold: 60000
          threadPool:
            threadCount: 25
            threadPriority: 5
            class: org.quartz.simpl.SimpleThreadPool
    jdbc:
      initialize-schema: NEVER

--- #################### 消息队列相关 ####################

rocketmq:
  name-server: 127.0.0.1:9876

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: 127.0.0.1:9092

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

spring:
  boot:
    admin:
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path}
        instance:
          service-host-type: IP
      context-path: /admin

# 日志输出到容器内 /librax-server/logs/，经 volume 挂载到宿主机 /opt/logs/，供 Promtail 采集
logging:
  file:
    name: /Users/yinan/workspace/logs/librax.log # 日志文件名，全路径
  level:
    com.librax.lab.module.infra.dal.mysql: debug
    com.librax.lab.module.infra.dal.mysql.logger.ApiErrorLogMapper: INFO
    com.librax.lab.module.infra.dal.mysql.job.JobLogMapper: INFO
    com.librax.lab.module.infra.dal.mysql.file.FileConfigMapper: INFO
    com.librax.lab.module.system.dal.mysql:
    com.librax.lab.module.system.dal.mysql.sms.SmsChannelMapper: INFO
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

debug: false

