server:
  port: 48080

--- #################### 数据库相关配置 ####################

spring:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 200  # 生产环境慢 SQL 阈值适当放宽
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 10
        min-idle: 10
        max-active: 50
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS 由 deploy-to-server.sh 通过 -e 注入
          # 默认值指向 deploy-ubuntu.sh 创建的 mysql-local 容器
          url: jdbc:mysql://${DB_HOST:mysql-local}:${DB_PORT:3306}/${DB_NAME:librax-sz}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${DB_USER:root}
          password: ${DB_PASS:root}
        slave:
          lazy: true
          url: jdbc:mysql://${DB_HOST:mysql-local}:${DB_PORT:3306}/${DB_NAME:librax-sz}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${DB_USER:root}
          password: ${DB_PASS:root}

  data:
    redis:
      # REDIS_HOST/REDIS_PORT/REDIS_PASS 由 deploy-to-server.sh 通过 -e 注入
      host: ${REDIS_HOST:redis-local}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASS:}  # 生产环境建议设置 Redis 密码

--- #################### 定时任务相关配置 ####################

spring:
  quartz:
    auto-startup: true
    scheduler-name: schedulerName
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true
            clusterCheckinInterval: 15000
            misfireThreshold: 60000
          threadPool:
            threadCount: 25
            threadPriority: 5
            class: org.quartz.simpl.SimpleThreadPool
    jdbc:
      initialize-schema: NEVER

--- #################### 消息队列相关 ####################

rocketmq:
  name-server: 127.0.0.1:9876

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: 127.0.0.1:9092

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health,info,metrics'  # 生产环境只暴露必要端点

spring:
  boot:
    admin:
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path}
        instance:
          service-host-type: IP
      context-path: /admin

# 日志输出到容器内 /librax-server/logs/，经 volume 挂载到宿主机 /opt/logs/，供 Promtail 采集
logging:
  file:
    name: /librax-server/logs/librax-server.log
  level:
    root: INFO
    com.librax.lab: INFO
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

debug: false

--- #################### 微信相关配置 ####################
# system 模块对 WxMpService / WxMaService 有硬注入，必须提供 appid，否则启动失败
wx:
  mp:
    app-id: ${WX_MP_APPID:wxf56b1542b9e85f8a}       # ← 可替换为客户的公众号 appid
    secret: ${WX_MP_SECRET:496379dcef1ba869e9234de8d598cfd3}
    config-storage:
      type: RedisTemplate
      key-prefix: wx
      http-client-type: HttpClient
  miniapp:
    appid: ${WX_MA_APPID:wxc4598c446f8a9cb3}          # ← 可替换为客户的小程序 appid
    secret: ${WX_MA_SECRET:4a1a04e07f6a4a0751b39c3064a92c8b}
    config-storage:
      type: RedisTemplate
      key-prefix: wa
      http-client-type: HttpClient

--- #################### 社交登录相关配置 ####################

justauth:
  enabled: true
  type:
    DINGTALK:
      client-id: ${DINGTALK_CLIENT_ID:dingvrnreaje3yqvzhxg}          # 可替换为客户的钉钉应用
      client-secret: ${DINGTALK_CLIENT_SECRET:i8E6iZyDvZj51JIb0tYsYfVQYOks9Cq1lgryEjFRqC79P3iJcrxEwT6Qk2QvLrLI}
      ignore-check-redirect-uri: true
    WECHAT_ENTERPRISE:
      client-id: ${WECHAT_CORP_ID:wwd411c69a39ad2e54}                 # 可替换为客户的企业微信
      client-secret: ${WECHAT_CORP_SECRET:1wTb7hYxnpT2TUbIeHGXGo7T0odav1ic10mLdyyATOw}
      agent-id: ${WECHAT_CORP_AGENT_ID:1000004}
      ignore-check-redirect-uri: true
    ALIPAY:
      client-id: xx
      client-secret: xx
      alipay-public-key: xx
      ignore-check-redirect-uri: true
      ignore-check-state: true
  cache:
    type: REDIS
    prefix: 'social_auth_state:'
    timeout: 24h

--- #################### 芋道相关配置 ####################

librax:
  captcha:
    enable: false  # 生产环境开启验证码
  security:
    mock-enable: false
  access-log:
    enable: true
  demo: false
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 1000  # 生产环境使用真实随机区间
    end-code: 9999

liteflow:
  rule-source-ext-data-map:
    applicationName: librax
    sqlLogEnabled: false
    pollingEnabled: false
    pollingIntervalSeconds: 60
    pollingStartSeconds: 60
    chainTableName: flow_chain
    chainApplicationNameField: application_name
    chainNameField: chain_name
    elDataField: el_data
    routeField: route
    namespaceField: namespace
    chainEnableField: enable
    chainCustomSql:
    scriptTableName: flow_script
    scriptApplicationNameField: application_name
    scriptIdField: script_id
    scriptNameField: script_name
    scriptDataField: script_data
    scriptTypeField: script_type
    scriptLanguageField: script_language
    scriptEnableField: enable
    scriptCustomSql:
  when-thread-pool-isolate: true
